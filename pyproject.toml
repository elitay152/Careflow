[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "careflow"
version = "0.1.0"
description = "A synthetic FHIR ingestion platform for healthcare analytics"
requires-python = ">=3.11"
dependencies = ["SQLAlchemy==2.0.46", "psycopg[binary]==3.2.13"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "fastapi==0.156.2", "httpx==0.28.1"]
analytics = ["dbt-postgres==1.11.0", "dbt-core==1.12.6", "dagster==1.13.26", "dagster-webserver==1.13.26"]
assistant = ["fastapi==0.156.2", "httpx==0.28.1", "uvicorn==0.34.2"]

[project.scripts]
careflow = "careflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
careflow = ["metric_catalog.json", "assistant_ui.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
