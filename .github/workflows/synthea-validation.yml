name: Synthea validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: careflow
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: careflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U careflow -d careflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bash scripts/install.sh
      - run: bash scripts/generate_synthea.sh
      - run: bash scripts/validate_synthea.sh data/synthea-v3.3.0-seed42/fhir synthea_ci
        env:
          DATABASE_URL: postgresql+psycopg://careflow:ci-only-password@localhost:5432/careflow
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: synthea-validation-results
          path: data/validation/
