name: Synthea validation
on:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.13
        env:
          POSTGRES_USER: careflow
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: careflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U careflow -d careflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bash scripts/install.sh
      - run: bash scripts/generate_synthea.sh
      - run: bash scripts/validate_synthea.sh data/synthea-v3.3.0-seed42/fhir synthea_ci
        env:
          DATABASE_URL: postgresql+psycopg://careflow:ci-only-password@localhost:5432/careflow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthea-validation-results
          path: data/validation/
