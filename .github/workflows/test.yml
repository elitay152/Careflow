name: Pipeline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: careflow
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: careflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U careflow -d careflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: bash scripts/install.sh
      - run: .venv/bin/pytest -q
      - run: .venv/bin/pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://careflow:ci-only-password@localhost:5432/careflow
      - name: Execute orchestrated pipeline
        run: |
          .venv/bin/careflow generate-demo --extended
          bash scripts/run_pipeline.sh
        env:
          DATABASE_URL: postgresql+psycopg://careflow:ci-only-password@localhost:5432/careflow
      - name: Evaluate baseline assistant and reader grant refresh
        run: |
          .venv/bin/python scripts/configure_assistant.py
          set -a
          . ./.env
          set +a
          .venv/bin/careflow warehouse-build
          .venv/bin/python -m careflow.evaluate --mode baseline --suite core --output data/evaluation/ci-baseline-core.json
        env:
          DATABASE_URL: postgresql+psycopg://careflow:ci-only-password@localhost:5432/careflow
      - name: Verify the isolated portfolio demo
        run: bash scripts/portfolio_demo.sh
        env:
          DATABASE_URL: postgresql+psycopg://careflow:ci-only-password@localhost:5432/careflow
