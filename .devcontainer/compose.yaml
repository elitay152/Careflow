services:
  workspace:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
    command: sleep infinity
    volumes:
      - ..:/workspaces/careflow:cached
    environment:
      DATABASE_URL: postgresql+psycopg://careflow:codespaces-local-only@postgres:5432/careflow
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_USER: careflow
      POSTGRES_DB: careflow
      POSTGRES_PASSWORD: codespaces-local-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careflow -d careflow"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
